# Site Settings
locale: "en-US"
title: "Jingquan Yan"
title_separator: "-"
name: &name "Jingquan Yan"
description: &description "Ph.D. Student in Computer Science and Engineering at UT Arlington"
url: https:/jyan97.github.io  # TODO: replace with your actual GitHub username
baseurl: ""
repository: "jyan97/jyan97.github.io"  # TODO: replace

# Site Author
author:
  name: "Jingquan Yan"
  avatar: "profile.png"  # TODO: place your photo as images/profile.png
  bio: "Ph.D. Student @ UTA | Trustworthy AI, Correlation Learning, AI4Science"
  location: "Arlington, TX"
  employer: "University of Texas at Arlington"
  uri:
  email: "ethanyanjq@gmail.com"
  researchgate:
  uri:
  bitbucket:
  codepen:
  dribbble:
  flickr:
  facebook:
  foursquare:
  github: # TODO: add your GitHub username
  google_plus:
  keybase:
  instagram:
  lastfm:
  linkedin: # TODO: add your LinkedIn username
  mastodon:
  medium:
  orcid: # TODO: add your ORCID if you have one
  pinterest:
  soundcloud:
  stackoverflow:
  steam:
  telegram:
  tumblr:
  twitter:
  vine:
  weibo:
  xing:
  youtube:
  wikipedia:
  googlescholar:-X3Id6cAAAAJ # TODO: add your Google Scholar ID


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Chicago

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Pagination
paginate: 5
paginate_path: /page:num/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
